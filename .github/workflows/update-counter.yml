# 閲覧数カウンターの画像（views.svg）を 5 分ごとに作り直し、専用ブランチ counter に置く。
# main には一切コミットしないので、コントリビューション（草）やコミット数は増えない。
# counter ブランチは毎回 1 コミットだけにして上書きする（履歴は溜まらない）。
name: Update profile view counter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update counter image
        run: python counter/update.py

      - name: Publish to counter branch if changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git fetch -q --depth=1 origin counter 2>/dev/null \
             && git show origin/counter:views.svg > /tmp/old.svg 2>/dev/null \
             && cmp -s /tmp/old.svg counter/views.svg; then
            echo "No change"
            exit 0
          fi
          work="$(mktemp -d)"
          cp counter/views.svg "$work/views.svg"
          cd "$work"
          git init -q -b counter
          git config user.name "myuto2490"
          git config user.email "192053786+myuto2490@users.noreply.github.com"
          git add views.svg
          git commit -q -m "Update profile view counter"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" counter
          echo "Published"
